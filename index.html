<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNAR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <h1 class="logo-title">VNAR News</h1>

        <div class="tab-buttons">
            <button id="tab-login" class="tab-btn">Đăng nhập</button>
            <button id="tab-signup" class="tab-btn">Đăng ký</button>
        </div>

        <div id="login-panel" class="panel">
            <h2>Đăng nhập</h2>
            <table class="auth-table" cellpadding="8" cellspacing="0">
                <tr>
                    <td>Tên đăng nhập</td>
                    <td><input type="text" id="login-username" placeholder="Nhập tên đăng nhập"></td>
                </tr>
                <tr>
                    <td>Mật khẩu</td>
                    <td><input type="password" id="login-password" placeholder="Nhập mật khẩu"></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <button id="btn-login" class="primary-btn">Đăng nhập</button>
                    </td>
                </tr>
            </table>
            <div id="login-message" class="message"></div>
        </div>

        <div id="signup-panel" class="panel">
            <h2>Đăng ký tài khoản</h2>
            <table class="auth-table" cellpadding="8" cellspacing="0">
                <tr>
                    <td>Tên đăng nhập</td>
                    <td><input type="text" id="signup-username" placeholder="Nhập tên đăng nhập"></td>
                </tr>
                <tr>
                    <td>Gmail</td>
                    <td><input type="email" id="signup-email" placeholder="Nhập Gmail (@gmail.com)"></td>
                </tr>
                <tr>
                    <td>Mật khẩu</td>
                    <td><input type="password" id="signup-password" placeholder="Nhập mật khẩu"></td>
                </tr>
                <tr>
                    <td>Nhập lại mật khẩu</td>
                    <td><input type="password" id="signup-password-confirm" placeholder="Nhập lại mật khẩu"></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <button id="btn-signup" class="primary-btn">Đăng ký</button>
                    </td>
                </tr>
            </table>
            <div id="signup-message" class="message"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
