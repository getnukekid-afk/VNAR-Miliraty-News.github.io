<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viết bài - VNAR NEWS</title>
    <link rel="stylesheet" href="news.css">
</head>
<body>
    <header class="top-bar">
        <a href="home.html" class="logo-link">
            <div class="logo-area">
                <span class="logo-main">VNAR NEWS</span>
                <span class="logo-sub">Trang thông tin truyền thông</span>
            </div>
        </a>
        <div class="search-area">
            <input type="text" placeholder="Nhập nội dung tìm kiếm">
            <button class="search-btn">🔍</button>
        </div>
        <div class="right-actions">
            <div class="user-menu">
                <button class="icon-btn user-menu-toggle" aria-label="Tài khoản">👤</button>
                <div class="user-menu-dropdown" id="user-menu-dropdown">
                    <button class="user-menu-item" id="logout-btn">Đăng xuất</button>
                </div>
            </div>
            <button class="icon-btn">☷</button>
        </div>
    </header>

    <main class="content">
        <section class="hero">
            <h1>Viết bài mới</h1>
            <p>Nhập tiêu đề, nội dung và tải lên ảnh, video, chữ ký.</p>
        </section>

        <section class="editor-section">
            <form id="article-form" enctype="multipart/form-data">
                <div class="editor-row">
                    <label for="title">Tiêu đề *</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="editor-row">
                    <label for="content">Nội dung *</label>
                    <textarea id="content" name="content" rows="10" required></textarea>
                </div>
                <div class="editor-row">
                    <label for="media">Ảnh / Video</label>
                    <input type="file" id="media" name="media" multiple accept="image/*,video/*">
                </div>
                <div class="editor-row">
                    <label for="cover">Ảnh hiển thị trên trang chủ</label>
                    <input type="file" id="cover" name="cover" accept="image/*">
                </div>
                <div class="editor-row">
                    <label for="authorName">Tên người viết *</label>
                    <input type="text" id="authorName" name="authorName" required>
                </div>
                <div class="editor-row">
                    <label for="signature">Chữ ký (ảnh)</label>
                    <input type="file" id="signature" name="signature" accept="image/*">
                </div>
                <button type="submit" class="primary-btn">Đăng bài</button>
                <div id="editor-message" class="message"></div>
            </form>
        </section>
    </main>

    <script src="news.js"></script>
    <script src="editor.js"></script>
</body>
</html>
